# Julia environment for the hexpr examples in this directory.
# Run an example with:
#   julia --project=example_ci example_ci/h2_3csfs/run.jl
#
# Kept separate from julia/Project.toml so that the HExpr binding itself
# has no HDF5 dependency. HDF5.jl is only needed by examples that read
# precomputed integrals from .h5 files.

[deps]
HDF5  = "f67ccb44-e63f-5c2f-98bd-6dc0ccc4ba2f"
HExpr = "04db43be-c920-4ee0-b432-501ddf03c3be"

[sources]
HExpr = { path = "../julia" }

[compat]
julia = "1"
HDF5  = "0.16, 0.17"
